<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMDB - Cercador de pel·lícules</title>
    <meta name="description" content="Cerca pel·lícules al cercador de TMDB, The Movie Database, i descobreix les estrenes i els clàssics més populars.">
    <link rel="icon" href="imatgeLogo.png">
</head>
<body>
    <header>
        <a href="https://www.themoviedb.org/?language=ca">
            <img src="https://www.themoviedb.org/assets/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB" height="25">
        </a>
        <nav>
            <ul>
                <li><a href="#buscador">Buscador</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="buscador">
            <h1>BUSCAR una pel·lícula</h1>
            <p>Milions de títols, un sol cercador.</p>
            <form method="get" action="https://www.themoviedb.org/search">
                <label for="cerca">Títol de la pel·lícula</label>
                <input type="search" id="cerca" name="query" placeholder="Cerca una pel·lícula, per exemple «Dune»..." required>
                <button type="submit">Cercar</button>
            </form>
        </section>

        <section>
            <h2>Resultats</h2>
            <article>
                <img src="dune2.png" alt="Cartell de Dune: Part Two">
                <h3>Dune: Part Two</h3>
                <p>2024</p>
            </article>
            <article>
                <img src="LOTR.png" alt="Cartell de The Lord of the Rings: The Two Towers">
                <h3>The Lord of the Rings: The Two Towers</h3>
                <p>2002</p>
            </article>
            <article>
                <img src="spiderman.png" alt="Cartell de Spider-Man: Brand New Day">
                <h3>Spider-Man: Brand New Day</h3>
                <p>2026</p>
            </article>
        </section>
    </main>

    <footer>
        <p>© 2026 The Movie Database — Maqueta de disseny</p>
    </footer>
</body>
</html>
